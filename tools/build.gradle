description = "tools that operate on the archie reference models and archetype object model"

dependencies {
    api project(':aom')
    api project(':base')
    api project(':bmm')
    api project(':path-queries')
    api project(':utils')

    api(libs.jakarta.xml.bind.api)
    api(libs.jsr305)

    implementation project(':grammars')
    implementation project(':openehr-terminology')

    implementation(libs.guava)
    implementation(libs.jackson.databind)
    implementation(libs.threeten.extra)
    implementation(libs.zafarkhaja.semver)

    testImplementation project(':archie-utils')
    // Only needed to run ExampleJsonInstanceGeneratorTest, which exercises the JSON schema validator.
    testImplementation project(':json-schema-tools')
    testImplementation project(':openehr-rm')
    testImplementation project(':referencemodels')
    testImplementation project(':test-rm')

    testImplementation(libs.commons.io)
    testImplementation(libs.jackson3.databind)
    testImplementation(libs.reflections)
}


// ADL 2 → ADL 1.4 down-converter CLI (fork addition; see docs/ADL2_TO_ADL14.md)
tasks.register('runADL2ToADL14', JavaExec) {
    group = 'application'
    description = 'Down-convert an ADL 2 file to ADL 1.4 text'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nedap.archie.adl14.down.ADL2ToADL14Cli'
    if (project.hasProperty('cliArgs')) {
        args project.property('cliArgs').toString().split(' ')
    } else if (project.hasProperty('args')) {
        args project.property('args').toString().split(' ')
    }
}
